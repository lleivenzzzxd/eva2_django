<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}PixelVault{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
body{background:radial-gradient(circle at 20% -10%,#1b1550 0,#0b0d17 45%) fixed;color:#e6e8f5;font-family:'Rajdhani',sans-serif;font-size:1.15rem}
h1,h2,.brand,.price{font-family:'Orbitron',sans-serif}
.brand{color:#fff;text-decoration:none;font-weight:800;letter-spacing:2px}.brand span{color:#22d3ee}
.panel{background:#141828;border:1px solid #242a44;border-radius:16px;padding:24px}
.price{color:#22d3ee}
.btn-neon{background:linear-gradient(90deg,#7c5cff,#5b8cff);border:0;color:#fff;font-weight:700}
.btn-neon:hover{color:#fff;filter:brightness(1.15)}
.form-control{background:#0e1120;border:1px solid #242a44;color:#e6e8f5}
.form-control:focus{background:#0e1120;color:#fff;border-color:#7c5cff}
.item img{width:120px;border-radius:8px}
</style>
</head>
<body>
<nav class="container py-3 d-flex justify-content-between align-items-center">
  <a class="brand" href="/">PIXEL<span>VAULT</span></a>
  <a href="{% url 'carrito' %}" class="btn btn-sm btn-neon">🛒 Carrito</a>
</nav>
<main class="container pb-5">
{% block contenido %}{% endblock %}
</main>
</body>
</html>
